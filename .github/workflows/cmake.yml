name: CMake

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  BUILD_TYPE: Release

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / shared=${{ matrix.shared }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            version: '14'
            shared: false
          - os: ubuntu-latest
            compiler: gcc
            version: '14'
            shared: true
          - os: ubuntu-latest
            compiler: gcc
            version: '15'
            shared: false
          - os: ubuntu-latest
            compiler: gcc
            version: '15'
            shared: true
          - os: ubuntu-latest
            compiler: intel
            version: '2023.2'
            shared: false
          - os: ubuntu-latest
            compiler: intel
            version: '2023.2'
            shared: true
          - os: macos-latest
            compiler: gcc
            version: '14'
            shared: false
          - os: macos-latest
            compiler: gcc
            version: '14'
            shared: true
          - os: windows-latest
            compiler: gcc
            version: '14'
            shared: false
          - os: windows-latest
            compiler: gcc
            version: '14'
            shared: true

    steps:
      - uses: actions/checkout@v4

      - uses: fortran-lang/setup-fortran@v1
        id: setup-fortran
        with:
          compiler: ${{ matrix.compiler }}
          version: ${{ matrix.version }}
      
      - name: Show Fortran compiler version
        run: '"$FC" --version'
        env:
          FC: ${{ steps.setup-fortran.outputs.fc }}
          CC: ${{ steps.setup-fortran.outputs.cc }}

      - name: Install BLAS/LAPACK dependencies
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y libblas-dev liblapack-dev
          elif [ "${{ runner.os }}" = "macOS" ]; then
            brew update
            brew install openblas
          fi

      # The Visual Studio generators do not support Fortran, so Windows builds
      # are driven by Ninja using the MinGW toolchain from setup-fortran.
      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y --no-progress

      - name: Select the CMake generator
        id: generator
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "flag=-GNinja" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure CMake
        run: >-
          cmake -S . -B build
          ${{ steps.generator.outputs.flag }}
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_Fortran_COMPILER="$FC"
          -DCMAKE_C_COMPILER="$CC"
          -DBUILD_TESTING=TRUE
          -DBUILD_SHARED_LIBS=${{ matrix.shared && 'TRUE' || 'FALSE' }}
        env:
          FC: ${{ steps.setup-fortran.outputs.fc }}
          CC: ${{ steps.setup-fortran.outputs.cc }}

      - name: Build with CMake
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Test with CMake
        working-directory: build
        run: ctest --output-on-failure -C ${{ env.BUILD_TYPE }}

      - name: Install with CMake
        run: cmake --install build --prefix "${{ github.workspace }}/install" --config ${{ env.BUILD_TYPE }}

      - name: Verify install with CMake consumer
        env:
          FC: ${{ steps.setup-fortran.outputs.fc }}
        run: |
          mkdir -p consumer
          cat > consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.24)
          project(spectrum_consumer LANGUAGES Fortran)

          find_package(spectrum CONFIG REQUIRED)

          add_executable(spectrum_consumer main.f90)
          target_link_libraries(spectrum_consumer PRIVATE spectrum::spectrum)
          EOF

          cat > consumer/main.f90 <<'EOF'
          program main
            use spectrum
            print *, "spectrum package found"
          end program main
          EOF

          cmake -S consumer -B consumer/build ${{ steps.generator.outputs.flag }} -DCMAKE_Fortran_COMPILER="$FC" -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install"
          cmake --build consumer/build